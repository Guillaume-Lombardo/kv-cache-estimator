    nvlinkDomain: 72
    weightFormats: *blackwellUltraWeights
    kvCacheFormats: *blackwellKv
    notes:
      - "4 GPUs par compute tray, domaine NVLink de 72 GPUs (NVL72)."
      - "Mémoire visible approximative : vérifiez avec nvidia-smi."

# -----------------------------------------------------------------------------
# Modèles
# -----------------------------------------------------------------------------
# layers : groupes de couches qui portent un cache
#   full    : attention globale GQA/MHA   { count, kvHeads, headDim, headDimV? }
