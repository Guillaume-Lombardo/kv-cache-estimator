#   mla     : Multi-head Latent Attention { count, kvLoraRank, ropeHeadDim, extraBytesPerToken? }
#   linear  : Mamba / DeltaNet / KDA      { count, stateElements }  (état constant par requête)
# Les couches sans cache (MLP seules, MTP) ne sont pas listées.
# confidence : high | medium | low. À vérifier contre le config.json de `source`.
