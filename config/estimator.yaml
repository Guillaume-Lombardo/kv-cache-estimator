#   sliding : fenêtre glissante / chunk   { count, kvHeads, headDim, headDimV?, window }
#   mla     : Multi-head Latent Attention { count, kvLoraRank, ropeHeadDim, extraBytesPerToken? }
#   linear  : Mamba / DeltaNet / KDA      { count, ssmElements, convElements }  (état constant)
# Les couches sans cache (MLP seules, MTP) ne sont pas listées.
# revision : révision Hugging Face du config.json vérifié (copie dans config/upstream/).
# confidence : high | medium | low.
