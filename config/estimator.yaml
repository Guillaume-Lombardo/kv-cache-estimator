      bf16: native
      fp16: native
      fp8: native
      int8: native
      int4: native
      mxfp4: native
      nvfp4: native
    kvCacheFormats: &blackwellKv
      bf16: native
      fp16: native
      fp8: native
      nvfp4: { level: native, note: "KV NVFP4 : disponible dans TensorRT-LLM, expérimental ou absent dans vLLM/SGLang selon la version." }
