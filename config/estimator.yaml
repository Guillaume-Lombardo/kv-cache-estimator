# =============================================================================
# Configuration de l'estimateur KV cache
# -----------------------------------------------------------------------------
# Lu au démarrage du serveur (relu à chaque requête en mode dev).
# Chemin alternatif : KV_ESTIMATOR_CONFIG=/chemin/vers/fichier.yaml (ou .json)
# Vérification      : npm run check-config
# Ajout d'un modèle : npm run import-model -- chemin/config.json  (voir README)
#
# Unités :
#   - memoryGiB : mémoire visible par le driver (nvidia-smi), en Gio (2^30 octets)
#   - paramsB   : milliards de paramètres
#   - support   : native | limited | unsupported, ou { level, note }
# =============================================================================

defaults:
  model: qwen3-32b
  gpu: h100
  engine: vllm
  gpuCount: 1
  contextTokens: 32768
  kvCacheFormat: bf16
  reservePct: 10 # ≈ vLLM --gpu-memory-utilization 0.90

# Hypothèses de l'estimation de débit (décodage limité par la bande passante mémoire).
performance:
  memoryEfficiency: 0.7 # part de la bande passante HBM atteinte
  computeEfficiency: 0.45 # MFU
  collectiveLatencyUs: { nvlink: 8, pcie: 30, network: 40 } # par all-reduce / all-to-all

# Nombres de GPUs proposés au-delà de 8 (72 seulement pour les domaines NVL72).
largeGpuCounts: [16, 32, 64, 72]

# -----------------------------------------------------------------------------
# Formats de poids — bits effectifs, échelles de quantification incluses.
# Les embeddings / lm_head restent en 16 bits quand on quantifie.
# -----------------------------------------------------------------------------
weightFormats:
  - { id: bf16, label: BF16, bitsPerParam: 16, compute: bf16, description: Format d'entraînement standard. }
  - { id: fp16, label: FP16, bitsPerParam: 16, compute: bf16, description: Seul format 16 bits sur Volta (V100). }
  - { id: fp8, label: FP8, bitsPerParam: 8, compute: fp8, description: "W8A8 FP8 (E4M3), échelles par bloc ou par canal." }
  - { id: int8, label: INT8, bitsPerParam: 8, compute: fp8, description: W8A8 INT8 (SmoothQuant) ou W8A16 (GPTQ-Int8). }
  - { id: int4, label: INT4, bitsPerParam: 4.25, compute: bf16, description: "W4A16 AWQ/GPTQ, groupes de 128 (échelle + zéro)." }
  - { id: mxfp4, label: MXFP4, bitsPerParam: 4.25, compute: fp4, description: "FP4 E2M1, échelle E8M0 par bloc de 32 (OCP MX)." }
  - { id: nvfp4, label: NVFP4, bitsPerParam: 4.5, compute: fp4, description: "FP4 E2M1, échelle FP8 par bloc de 16 (NVIDIA)." }

# -----------------------------------------------------------------------------
# Formats du KV cache
# -----------------------------------------------------------------------------
kvCacheFormats:
  - { id: bf16, label: BF16, bytesPerElement: 2 }
  - { id: fp16, label: FP16, bytesPerElement: 2 }
  - { id: fp8, label: FP8, bytesPerElement: 1, description: "E4M3 (ou E5M2), échelles par tenseur. Perte de qualité généralement faible." }
  - { id: nvfp4, label: NVFP4, bytesPerElement: 0.5625, description: 4 bits + échelle FP8 par bloc de 16. Blackwell uniquement. }

# -----------------------------------------------------------------------------
# Moteurs d'inférence — un format doit être supporté par le GPU ET par le moteur.
# -----------------------------------------------------------------------------
engines:
  - id: vllm
    name: vLLM / llm-d
    description: "vLLM ≥ 0.11 (moteur V1). llm-d orchestre des instances vLLM : mêmes besoins mémoire par instance."
    features: { slidingWindowOptimized: true, dpAttention: true, kvOffload: true }
    weightFormats:
      bf16: native
      fp16: native
      fp8: native
      int8: { level: native, note: "W8A8 via compressed-tensors, ou W8A16 GPTQ." }
      int4: { level: native, note: AWQ / GPTQ via kernels Marlin (sm80+). }
      mxfp4: native
      nvfp4: { level: native, note: Checkpoints ModelOpt ou compressed-tensors. }
    kvCacheFormats:
      bf16: native
      fp16: native
      fp8: { level: native, note: "--kv-cache-dtype fp8 (e4m3) ; échelles calibrées recommandées." }
      nvfp4: { level: limited, note: KV NVFP4 expérimental ou absent selon la version de vLLM. }
    gpus:
      v100: { level: limited, note: "Volta (sm70) : pas de FlashAttention, de FP8 ni de Marlin. Support non garanti dans vLLM V1 récent." }
    notes:
      - Blocs KV de 16 tokens (arrondi négligeable). Prefix caching non compté.
      - "États récurrents (Mamba, DeltaNet, KDA) : type piloté par --mamba-ssm-cache-dtype ou par le config.json du modèle."
      - "llm-d : désagrégation prefill/decode et routage KV-aware entre instances vLLM ; le dimensionnement par instance est identique."
    flags:
      memoryUtilization: --gpu-memory-utilization
      kvCacheDtype: --kv-cache-dtype
      tensorParallel: --tensor-parallel-size
      pipelineParallel: --pipeline-parallel-size
      dpAttention: --data-parallel-size N --enable-expert-parallel
      kvOffload: "--kv-offloading-size <Gio> (connecteur natif) ou LMCache"

  - id: zml
    name: ZML (llmd)
    description: "Profil indicatif, à compléter : ZML compile le graphe via OpenXLA/PJRT."
    confidence: low
    features: { slidingWindowOptimized: false, dpAttention: false, kvOffload: false }
    weightFormats:
      bf16: native
      fp16: native
      fp8: { level: limited, note: Support à vérifier dans la version de ZML utilisée. }
      int8: { level: limited, note: Support à vérifier dans la version de ZML utilisée. }
      int4: { level: limited, note: Support à vérifier dans la version de ZML utilisée. }
      mxfp4: { level: limited, note: Support à vérifier dans la version de ZML utilisée. }
      nvfp4: { level: limited, note: Support à vérifier dans la version de ZML utilisée. }
    kvCacheFormats:
      bf16: native
      fp16: native
      fp8: { level: limited, note: Support à vérifier dans la version de ZML utilisée. }
    gpus:
      v100: { level: limited, note: Support de Volta à vérifier. }
    notes:
      - "Profil non vérifié : formats, gestion du KV (paginée ou préallouée) et fenêtres glissantes à confirmer. Fenêtres glissantes comptées au contexte complet par prudence."
      - Pour llm-d (orchestration Kubernetes de vLLM), choisissez le profil vLLM.

# -----------------------------------------------------------------------------
# GPUs — TFLOPS denses (sans sparsité), approximatifs.
# -----------------------------------------------------------------------------
gpus:
  - id: v100
    name: V100
    architecture: Volta
    computeCapability: "7.0"
    memoryGiB: 31.7
    memoryLabel: 32 Go HBM2
    bandwidthTBs: 0.9
    tflops: { bf16: 125 } # FP16 tensor core
    interconnect: { label: NVLink 2 (300 Go/s bidir.), nvlink: true, bandwidthGBs: 150 }
    maxGpusPerNode: 8
    nvlinkDomain: 8
    hostLinkGBs: 12
    hostLinkLabel: PCIe Gen3 x16
    weightFormats:
      bf16: { level: unsupported, note: Pas de BF16 matériel sur Volta. Utilisez FP16. }
      fp16: native
      fp8: { level: unsupported, note: Pas de FP8 avant Ada/Hopper (sm89+). }
      int8: { level: limited, note: "Pas de tensor cores INT8 sur Volta : W8A16 via kernels génériques, lent." }
      int4: { level: limited, note: "Kernels Marlin indisponibles (sm80+). GPTQ/AWQ via anciens kernels, support moteur réduit." }
      mxfp4: { level: unsupported, note: FP4 non supporté sur Volta. }
      nvfp4: { level: unsupported, note: FP4 non supporté sur Volta. }
    kvCacheFormats:
      bf16: { level: unsupported, note: Pas de BF16 sur Volta. }
      fp16: native
      fp8: { level: unsupported, note: Pas de FP8 matériel ; non géré par les backends d'attention récents. }
      nvfp4: { level: unsupported, note: Blackwell uniquement. }
    notes:
      - FlashAttention 2/3 non supporté (sm70).
      - "Topologie DGX-1 en hybrid cube mesh : NVLink pas tout-à-tout à 8 GPUs."

  - id: l40s
    name: L40S
    architecture: Ada Lovelace
    computeCapability: "8.9"
    memoryGiB: 45.0
    memoryLabel: 48 Go GDDR6
    bandwidthTBs: 0.864
    tflops: { bf16: 181, fp8: 362 }
    interconnect: { label: "PCIe Gen4 x16 (~32 Go/s par sens)", nvlink: false, bandwidthGBs: 32 }
    maxGpusPerNode: 8
    nvlinkDomain: 1
    hostLinkGBs: 25
    hostLinkLabel: PCIe Gen4 x16
    weightFormats:
      bf16: native
      fp16: native
      fp8: native
      int8: native
      int4: native
      mxfp4: { level: limited, note: "Pas de FP4 matériel : W4A16 (Marlin), déquantification en BF16." }
      nvfp4: { level: limited, note: "Pas de FP4 matériel : W4A16 (Marlin), déquantification en BF16." }
    kvCacheFormats:
      bf16: native
      fp16: native
      fp8: native
      nvfp4: { level: unsupported, note: Blackwell uniquement. }
    notes:
      - Pas de NVLink ni de NVSwitch. Le multi-GPU passe par PCIe.
      - "Bande passante mémoire GDDR6 ~4× plus faible qu'un H100 : décodage plus lent."

  - id: h100
    name: H100 SXM
    architecture: Hopper
    computeCapability: "9.0"
    memoryGiB: 79.6
    memoryLabel: 80 Go HBM3
    bandwidthTBs: 3.35
    tflops: { bf16: 989, fp8: 1979 }
    interconnect: { label: NVLink 4 + NVSwitch (900 Go/s bidir.), nvlink: true, bandwidthGBs: 450 }
    maxGpusPerNode: 8
    nvlinkDomain: 8
    hostLinkGBs: 55
    hostLinkLabel: PCIe Gen5 x16
    weightFormats: &hopperWeights
      bf16: native
      fp16: native
      fp8: native
      int8: native
      int4: native
      mxfp4: { level: limited, note: "Pas de FP4 matériel : W4A16 (Marlin / Triton), déquantification en BF16." }
      nvfp4: { level: limited, note: "Pas de FP4 matériel : W4A16 (Marlin), déquantification en BF16." }
    kvCacheFormats: &hopperKv
      bf16: native
      fp16: native
      fp8: native
      nvfp4: { level: unsupported, note: Blackwell uniquement. }
    notes: []

  - id: h200
    name: H200
    architecture: Hopper
    computeCapability: "9.0"
    memoryGiB: 140.4
    memoryLabel: 141 Go HBM3e
    bandwidthTBs: 4.8
    tflops: { bf16: 989, fp8: 1979 }
    interconnect: { label: NVLink 4 + NVSwitch (900 Go/s bidir.), nvlink: true, bandwidthGBs: 450 }
    maxGpusPerNode: 8
