# =============================================================================
# KV cache estimator configuration
# -----------------------------------------------------------------------------
# Read at server startup (read again on every request in development).
# Alternative path: KV_ESTIMATOR_CONFIG=/path/to/file.yaml (or .json)
# Validation: pnpm run check-config
# Add a model: pnpm run import-model path/config.json or --hf org/name (see docs/catalogue.md)
#
# Units:
#   - memoryGiB: driver-visible memory (nvidia-smi), in GiB (2^30 bytes)
#   - paramsB: billions of parameters
#   - support: native | limited | unverified | unsupported, or { level, note, memoryFormat? }
# =============================================================================

defaults:
  model: qwen3-32b
  gpu: h100
  engine: vllm
  # Qwen3-32B in BF16 on one H100 leaves less than one 32k request once activations and CUDA graphs are counted.
  gpuCount: 2
  contextTokens: 32768
  kvCacheFormat: bf16
  reservePct: 10 # ≈ vLLM --gpu-memory-utilization 0.90

# Throughput estimation assumptions (memory-bandwidth-bound decoding).
performance:
  memoryEfficiency: 0.7 # fraction of HBM bandwidth reached
  computeEfficiency: 0.45 # MFU
  collectiveLatencyUs: { nvlink: 8, pcie: 30, network: 40 } # per all-reduce / all-to-all

# GPU counts offered above 8 (72 only for NVL72 domains).
largeGpuCounts: [16, 32, 64, 72]
# Offered only when usable: whole servers (multiple of maxGpusPerNode) or within the interconnect domain,
# and at least one valid TP / PP or DP-attention layout for the selected model and engine.
intermediateGpuCounts: [12, 24, 48]

# -----------------------------------------------------------------------------
# Weight formats: effective bits, including quantization scales.
# Embeddings / lm_head stay at 16 bits when quantizing.
# -----------------------------------------------------------------------------
weightFormats:
  - { id: bf16, label: BF16, bitsPerParam: 16, compute: bf16, description: { fr: "Format d'entraînement standard.", en: "Standard training format." } }
  - { id: fp16, label: FP16, bitsPerParam: 16, compute: bf16, description: { fr: "Seul format 16 bits sur Volta (V100).", en: "Only 16-bit format on Volta (V100)." } }
  - { id: fp8, label: FP8, bitsPerParam: 8, compute: fp8, description: { fr: "W8A8 FP8 (E4M3), échelles par bloc ou par canal.", en: "W8A8 FP8 (E4M3), per-block or per-channel scales." } }
  - { id: int8, label: INT8, bitsPerParam: 8, compute: fp8, description: { fr: "W8A8 INT8 (SmoothQuant) ou W8A16 (GPTQ-Int8).", en: "W8A8 INT8 (SmoothQuant) or W8A16 (GPTQ-Int8)." } }
  - { id: int4, label: INT4, bitsPerParam: 4.25, compute: bf16, description: { fr: "W4A16 AWQ/GPTQ, groupes de 128 (échelle + zéro).", en: "W4A16 AWQ/GPTQ, groups of 128 (scale + zero)." } }
  - { id: mxfp4, label: MXFP4, bitsPerParam: 4.25, compute: fp4, description: { fr: "FP4 E2M1, échelle E8M0 par bloc de 32 (OCP MX).", en: "FP4 E2M1, E8M0 scale per block of 32 (OCP MX)." } }
  - { id: nvfp4, label: NVFP4, bitsPerParam: 4.5, compute: fp4, description: { fr: "FP4 E2M1, échelle FP8 par bloc de 16 (NVIDIA).", en: "FP4 E2M1, FP8 scale per block of 16 (NVIDIA)." } }

# -----------------------------------------------------------------------------
# KV cache formats
# -----------------------------------------------------------------------------
kvCacheFormats:
  - { id: bf16, label: BF16, bytesPerElement: 2 }
  - { id: fp16, label: FP16, bytesPerElement: 2 }
  - { id: fp8, label: FP8, bytesPerElement: 1, description: { fr: "E4M3 (ou E5M2), échelles par tenseur. Perte de qualité généralement faible.", en: "E4M3 (or E5M2), per-tensor scales. Quality loss is usually small." } }
  - { id: nvfp4, label: NVFP4, bytesPerElement: 0.5625, description: { fr: "4 bits + échelle FP8 par bloc de 16. Blackwell uniquement.", en: "4 bits + FP8 scale per block of 16. Blackwell only." } }

# -----------------------------------------------------------------------------
# Inference engines: both the GPU AND the engine must support a format.
# -----------------------------------------------------------------------------
engines:
  - id: vllm
    name: vLLM / llm-d
    description: { fr: "vLLM ≥ 0.11 (moteur V1). llm-d orchestre des instances vLLM : mêmes besoins mémoire par instance.", en: "vLLM ≥ 0.11 (V1 engine). llm-d orchestrates vLLM instances: same memory needs per instance." }
    version: vLLM ≥ 0.11
    features:
      kvPaging: true
      kvPoolPreallocated: true
      prefixCaching: true
      continuousBatching: true
      slidingWindowAttention: true
      slidingWindowFreesBlocks: true
      tensorParallel: true
      pipelineParallel: true
      dpAttention: true
      kvOffload: true
    featureNotes:
      kvPoolPreallocated: { fr: "Pool de blocs dimensionné au démarrage (--gpu-memory-utilization, après profilage des activations) ; blocs paginés à l'intérieur.", en: "Block pool sized at startup (--gpu-memory-utilization, after activation profiling); paged blocks inside it." }
      slidingWindowFreesBlocks: { fr: "Gestionnaire de KV hybride (vLLM ≥ 0.10) : les blocs sortis de la fenêtre sont rendus au pool.", en: "Hybrid KV manager (vLLM ≥ 0.10): blocks that leave the window are returned to the pool." }
      kvOffload: { fr: "Connecteur d'offload CPU natif ou LMCache.", en: "Native CPU offload connector or LMCache." }
    sources:
      - { label: { fr: "Documentation vLLM", en: "vLLM documentation" }, url: "https://docs.vllm.ai/" }
      - { label: { fr: "Calcul de la mémoire KV (gpu_worker.py, v0.32.0)", en: "KV memory sizing (gpu_worker.py, v0.32.0)" }, url: "https://github.com/vllm-project/vllm/blob/v0.32.0/vllm/v1/worker/gpu_worker.py" }
      - { label: { fr: "Valeurs par défaut (arg_utils.py, v0.32.0)", en: "Defaults (arg_utils.py, v0.32.0)" }, url: "https://github.com/vllm-project/vllm/blob/v0.32.0/vllm/engine/arg_utils.py" }
    weightFormats:
      bf16: native
      fp16: native
      fp8: native
      int8: { level: native, note: { fr: "W8A8 via compressed-tensors, ou W8A16 GPTQ.", en: "W8A8 via compressed-tensors, or W8A16 GPTQ." } }
      int4: { level: native, note: { fr: "AWQ / GPTQ via kernels Marlin (sm80+).", en: "AWQ / GPTQ via Marlin kernels (sm80+)." } }
      mxfp4: native
      nvfp4: { level: native, note: { fr: "Checkpoints ModelOpt ou compressed-tensors.", en: "ModelOpt or compressed-tensors checkpoints." } }
    kvCacheFormats:
      bf16: native
      fp16: native
      fp8: { level: native, note: { fr: "--kv-cache-dtype fp8 (e4m3) ; échelles calibrées recommandées.", en: "--kv-cache-dtype fp8 (e4m3); calibrated scales recommended." } }
      nvfp4: { level: limited, note: { fr: "KV NVFP4 expérimental ou absent selon la version de vLLM.", en: "NVFP4 KV experimental or missing depending on the vLLM version." } }
    gpus:
      v100: { level: limited, note: { fr: "Volta (sm70) : pas de FlashAttention, de FP8 ni de Marlin. vLLM documente désormais un minimum sm75 : support non garanti.", en: "Volta (sm70): no FlashAttention, FP8 or Marlin. vLLM now documents an sm75 minimum: support not guaranteed." } }
    notes:
      - { fr: "Blocs KV de 16 tokens (arrondi négligeable). Prefix caching non compté.", en: "16-token KV blocks (negligible rounding). Prefix caching not counted." }
      - { fr: "États récurrents (Mamba, DeltaNet, KDA) : type piloté par --mamba-ssm-cache-dtype ou par le config.json du modèle.", en: "Recurrent states (Mamba, DeltaNet, KDA): type set by --mamba-ssm-cache-dtype or by the model's config.json." }
      - { fr: "llm-d : désagrégation prefill/decode et routage KV-aware entre instances vLLM ; le dimensionnement par instance est identique.", en: "llm-d: prefill/decode disaggregation and KV-aware routing across vLLM instances; per-instance sizing is the same." }
    # KV pool = utilization × total memory − weights − non-PyTorch memory − profiled activation peak − CUDA graphs
    # (gpu_worker.py determine_available_memory; CUDA graph profiling on by default since v0.21.0).
    # The fixed amounts are orders of magnitude: the startup log prints the measured values
    # ("Actual usage is … for consumed memory, … for peak activation, and … for CUDAGraph memory").
    memory: { overheadInBudget: true, fixedOverheadGiB: 0.5, cudaGraphGiB: 1.0 }
    # vllm serve defaults (arg_utils.py get_batch_defaults, v0.32.0): ≥ 160 GiB → 16384 tokens / 1024 seqs;
    # ≥ 70 GiB except A100 → 8192 / 1024; otherwise 2048 / 256.
    runtime:
      maxNumBatchedTokens: 2048
      maxNumSeqs: 256
      byMemory:
        - { minMemoryGiB: 160, maxNumBatchedTokens: 16384, maxNumSeqs: 1024 }
        - { minMemoryGiB: 70, maxNumBatchedTokens: 8192, maxNumSeqs: 1024, exceptGpus: [a100-80, a100-pcie-80] }
    # ROCm (quantization matrix, docs.vllm.ai/en/latest/features/quantization/).
    vendorFormats:
      amd:
        weightFormats:
          int8: { level: unsupported, note: { fr: "W8A8 INT8 absent de la matrice ROCm de vLLM.", en: "W8A8 INT8 missing from vLLM's ROCm matrix." } }
          int4: { level: unsupported, note: { fr: "AWQ / GPTQ non supportés sur GPU AMD dans vLLM (pas de Marlin sous ROCm).", en: "AWQ / GPTQ not supported on AMD GPUs in vLLM (no Marlin on ROCm)." } }
          nvfp4: { level: unverified, note: { fr: "Émulation générique seulement ; chemin ROCm non vérifié.", en: "Generic emulation only; ROCm path not verified." } }
        kvCacheFormats:
          fp8: { level: native, note: { fr: "ROCm : fp8 = e4m3 uniquement.", en: "ROCm: fp8 = e4m3 only." } }
          nvfp4: { level: unsupported, note: { fr: "Pas de KV NVFP4 dans le backend d'attention ROCm.", en: "No NVFP4 KV in the ROCm attention backend." } }
    flags:
      launch: vllm serve
      maxModelLen: --max-model-len
      maxNumBatchedTokens: --max-num-batched-tokens
      maxNumSeqs: --max-num-seqs
      mambaSsmCacheDtype: --mamba-ssm-cache-dtype
      memoryUtilization: --gpu-memory-utilization
      kvCacheDtype: --kv-cache-dtype
      tensorParallel: --tensor-parallel-size
      pipelineParallel: --pipeline-parallel-size
      dpAttention: --data-parallel-size N --enable-expert-parallel
      kvOffload: { fr: "--kv-offloading-size <Gio> (connecteur natif) ou LMCache", en: "--kv-offloading-size <GiB> (native connector) or LMCache" }

  # Profile sourcing rules:
  #   - server capabilities (paging, batching, prefix caching, TP): LLMD documentation;
  #   - formats, KV precision, sliding windows: ZML library code @3500e88 (October 9, 2026),
  #     CUDA backend. Implemented and connected: yes; present but unused or unsourced: unverified;
  #     explicit TODO or panic: no. LLMD's own source code is not public.
  - id: zml
    name: ZML / LLMD
    description: { fr: "Serveur LLMD de ZML, sur la bibliothèque github.com/zml/zml (OpenXLA/PJRT). Capacités serveur selon la doc LLMD, formats selon le code de la bibliothèque.", en: "ZML's LLMD server, built on the github.com/zml/zml library (OpenXLA/PJRT). Server capabilities from the LLMD docs, formats from the library code." }
    version: { fr: "LLMD (page zml.ai/llmd, oct. 2026) + bibliothèque ZML @3500e88", en: "LLMD (zml.ai/llmd page, Oct. 2026) + ZML library @3500e88" }
    confidence: medium
    # LLMD page: "A self-contained inference server for LLaMa, Gemma, Qwen and Mistral models".
    modelFamilies: [Meta (Llama), Google (Gemma), Qwen (Alibaba), Mistral AI]
    features:
      kvPaging: true
      kvPoolPreallocated: unverified
      prefixCaching: true
      continuousBatching: true
      slidingWindowAttention: true
      slidingWindowFreesBlocks: unverified
      tensorParallel: true
      pipelineParallel: unverified
      dpAttention: unverified
      kvOffload: unverified
    featureNotes:
      kvPaging: { fr: "« Paged attention » (page LLMD). Bibliothèque : API paginée, taille de page = dimension k_chunk du pool {page, k_chunk, hkv, hd} (zml/attention/paged_attention.zig).", en: "\"Paged attention\" (LLMD page). Library: paged API, page size = k_chunk dimension of the {page, k_chunk, hkv, hd} pool (zml/attention/paged_attention.zig)." }
      kvPoolPreallocated: { fr: "Non documenté pour LLMD. Bibliothèque : pas de gestionnaire de pages ni de dimensionnement du pool par fraction mémoire ; seul l'allocateur XLA/PJRT réserve 90 % (memory_fraction, zml/platform.zig) ; les exemples préallouent un cache dense au démarrage.", en: "Not documented for LLMD. Library: no page manager and no pool sizing by memory fraction; only the XLA/PJRT allocator reserves 90% (memory_fraction, zml/platform.zig); the examples preallocate a dense cache at startup." }
      prefixCaching: { fr: "« Prefix caching » (page LLMD) ; absent de la bibliothèque (implémenté côté serveur).", en: "\"Prefix caching\" (LLMD page); absent from the library (implemented server-side)." }
      continuousBatching: { fr: "« Continuous batching » (page LLMD). Bibliothèque : batch mixte prefill/decode (batch_size_prefill / batch_size_decode).", en: "\"Continuous batching\" (LLMD page). Library: mixed prefill/decode batch (batch_size_prefill / batch_size_decode)." }
      slidingWindowAttention: { fr: "LLMD sert Gemma (page LLMD), dont les couches locales l'exigent. Masque à fenêtre dans les noyaux CUDA FA2, FA3 et Triton (paged_attention.zig, flashattn.zig) ; refusé sur StableHLO (panic).", en: "LLMD serves Gemma (LLMD page), whose local layers require it. Window mask in the CUDA FA2, FA3 and Triton kernels (paged_attention.zig, flashattn.zig); rejected on StableHLO (panic)." }
      slidingWindowFreesBlocks: { fr: "Bibliothèque : aucune libération des pages hors fenêtre, gain de calcul seulement (tuiles sautées). La gestion des pages relève de LLMD (code non public).", en: "Library: pages outside the window are never freed; compute savings only (skipped tiles). Page management is up to LLMD (code not public)." }
      tensorParallel: { fr: "« Tensor parallel sharding » (page LLMD). Bibliothèque : têtes KV shardées sur l'axe model, répliquées si non divisibles.", en: "\"Tensor parallel sharding\" (LLMD page). Library: KV heads sharded along the model axis, replicated if not divisible." }
      pipelineParallel: { fr: "Absent de la page LLMD et de la bibliothèque.", en: "Absent from the LLMD page and the library." }
      dpAttention: { fr: "Bibliothèque : expert parallel (axe experts) et axe data, sans DP-attention dédiée.", en: "Library: expert parallel (experts axis) and data axis, without dedicated DP-attention." }
      kvOffload: { fr: "Absent de la page LLMD et de la bibliothèque.", en: "Absent from the LLMD page and the library." }
    sources:
      - { label: { fr: "Documentation LLMD", en: "LLMD documentation" }, url: "https://zml.ai/llmd/" }
      - { label: { fr: "Bibliothèque ZML @3500e88", en: "ZML library @3500e88" }, url: "https://github.com/zml/zml/tree/3500e88cf84e0e98d37b0f6048e6af9d33bc6108" }
    weightFormats:
      bf16: { level: native, note: { fr: "Modèles BF16 servis tels quels (page LLMD : Qwen/Qwen3-8B, Qwen3.6-27B ; gabarit de bug LLMD : gemma-4-31B-it).", en: "BF16 models served as is (LLMD page: Qwen/Qwen3-8B, Qwen3.6-27B; LLMD bug template: gemma-4-31B-it)." } }
      fp16: { level: native, note: { fr: "F16 accepté par les noyaux d'attention CUDA (flashattn.zig).", en: "F16 accepted by the CUDA attention kernels (flashattn.zig)." } }
      fp8: { level: unverified, note: { fr: "Bibliothèque : schémas fp8_block128 (DeepSeek), fp8_block32, fp8_per_channel, fp8_per_tensor, gardés quantifiés en mémoire (xla.scaled_dot, zml/nn.zig) ; MoE FP8 via Triton. Chargement par LLMD non vérifié.", en: "Library: fp8_block128 (DeepSeek), fp8_block32, fp8_per_channel, fp8_per_tensor schemes, kept quantized in memory (xla.scaled_dot, zml/nn.zig); FP8 MoE via Triton. Loading by LLMD not verified." } }
      int8: { level: unsupported, note: { fr: "Non implémenté dans la bibliothèque ZML @3500e88 (TODO « INT4/8 », zml/nn.zig).", en: "Not implemented in the ZML library @3500e88 (TODO \"INT4/8\", zml/nn.zig)." } }
      int4: { level: unsupported, note: { fr: "AWQ / GPTQ / INT4 non implémentés dans la bibliothèque ZML @3500e88 (TODO « INT4/8 », zml/nn.zig).", en: "AWQ / GPTQ / INT4 not implemented in the ZML library @3500e88 (TODO \"INT4/8\", zml/nn.zig)." } }
      mxfp4: { level: unverified, note: { fr: "Bibliothèque : schéma mxfp4 (échelle E8M0 / 32), gardé quantifié ; MoE via CuTe ou Triton MXFP4 sur Blackwell (sm10x), Triton générique ailleurs. Chargement par LLMD non vérifié.", en: "Library: mxfp4 scheme (E8M0 scale / 32), kept quantized; MoE via CuTe or Triton MXFP4 on Blackwell (sm10x), generic Triton elsewhere. Loading by LLMD not verified." } }
      nvfp4: { level: unverified, note: { fr: "Bibliothèque : schéma nvfp4 (échelle E4M3 / 16), gardé quantifié ; MoE NVFP4 uniquement via FlashInfer CUTLASS sur sm100/103/120 (erreur ailleurs) ; quantification des activations sur sm100+. Chargement par LLMD non vérifié.", en: "Library: nvfp4 scheme (E4M3 scale / 16), kept quantized; NVFP4 MoE only via FlashInfer CUTLASS on sm100/103/120 (error elsewhere); activation quantization on sm100+. Loading by LLMD not verified." } }
    kvCacheFormats:
      bf16: { level: native, note: { fr: "Type du cache = type des embeddings (exemples ZML).", en: "Cache type = embedding type (ZML examples)." } }
      fp16: native
      fp8: { level: unsupported, note: { fr: "bibliothèque ZML @3500e88 : FA2/FA3 refusent le FP8 (panic), noyau Triton capable de déquantifier mais désactivé dans le wrapper (use_fp8 = false). Exception : cache MLA FP8/FP4 sur Blackwell (CuTe).", en: "ZML library @3500e88: FA2/FA3 reject FP8 (panic); the Triton kernel can dequantize but is disabled in the wrapper (use_fp8 = false). Exception: FP8/FP4 MLA cache on Blackwell (CuTe)." } }
      nvfp4: { level: unsupported, note: { fr: "Pas de KV FP4 pour l'attention standard dans la bibliothèque ZML @3500e88 (cache compressé FP4 seulement pour la MLA parcimonieuse sur Blackwell).", en: "No FP4 KV for standard attention in the ZML library @3500e88 (FP4 compressed cache only for sparse MLA on Blackwell)." } }
    gpus:
      v100: { level: unverified, note: { fr: "Aucune vérification sm70 dans la bibliothèque (FA3 réservé à sm90, FA2 sans minimum déclaré).", en: "No sm70 check in the library (FA3 restricted to sm90, FA2 with no declared minimum)." } }
      mi300x: &zmlRocm { level: unverified, note: { fr: "ROCm annoncé par la page LLMD ; ce profil décrit le backend CUDA.", en: "ROCm advertised on the LLMD page; this profile describes the CUDA backend." } }
      mi325x: *zmlRocm
      mi355x: *zmlRocm
    notes:
      - { fr: "Capacités serveur selon la documentation LLMD ; formats, précision du KV et fenêtres glissantes selon le code de la bibliothèque ZML @3500e88, backend CUDA. Le code de LLMD n'est pas public : une version plus récente peut différer.", en: "Server capabilities from the LLMD documentation; formats, KV precision and sliding windows from the ZML library code @3500e88, CUDA backend. LLMD's code is not public: a newer version may differ." }
      - { fr: "États récurrents (Gated DeltaNet) en FP32 dans la bibliothèque, préalloués.", en: "Recurrent states (Gated DeltaNet) in FP32 in the library, preallocated." }
      - { fr: "MLA : cache latent 512 + RoPE 64 ; cache de l'indexeur DSA non trouvé dans la bibliothèque.", en: "MLA: latent cache 512 + RoPE 64; DSA indexer cache not found in the library." }
      - { fr: "FlashAttention 3 sur sm90 (H100/H200/GH200), FlashAttention 2 sur les autres GPU CUDA, Triton pour l'attention paginée.", en: "FlashAttention 3 on sm90 (H100/H200/GH200), FlashAttention 2 on other CUDA GPUs, Triton for paged attention." }
      - { fr: "Page LLMD : CUDA, ROCm, TPU, oneAPI et Metal ; image zmlai/llmd:cuda (1,7 Go) ; chargement direct hf://, s3://, gs:// ; tool calling ; métriques Prometheus (/metrics).", en: "LLMD page: CUDA, ROCm, TPU, oneAPI and Metal; zmlai/llmd:cuda image (1.7 GB); direct loading from hf://, s3://, gs://; tool calling; Prometheus metrics (/metrics)." }
      - { fr: "Décodage spéculatif DFlash natif pour Gemma 4 (Qwen prévu) : non modélisé ici (réduit la latence, ajoute un modèle brouillon en mémoire).", en: "Native DFlash speculative decoding for Gemma 4 (Qwen planned): not modeled here (reduces latency, adds a draft model in memory)." }
      - { fr: "La page ne précise ni les formats de poids, ni la précision du KV, ni la gestion des fenêtres glissantes : ces points viennent du code de la bibliothèque.", en: "The page specifies neither weight formats, KV precision nor sliding-window handling: these come from the library code." }
      - { fr: "À ne pas confondre avec llm-d (orchestration Kubernetes de vLLM), couvert par le profil vLLM.", en: "Not to be confused with llm-d (Kubernetes orchestration of vLLM), covered by the vLLM profile." }
    # The XLA/PJRT allocator reserves its memory fraction for everything, activations included; amounts unverified.
    memory: { overheadInBudget: true, fixedOverheadGiB: 0.5, cudaGraphGiB: 0 }
    runtime: { maxNumBatchedTokens: 8192, maxNumSeqs: 256 }

  # SGLang v0.5.22 (October 2026): server arguments, quantization and HiCache documentation, plus
  # arg_groups/memory_hook.py for memory accounting. Not measured on hardware.
  - id: sglang
    name: SGLang
    description: { fr: "SGLang ≥ 0.5 : RadixAttention, DP-attention et expert parallel pour les MoE, HiCache pour l'offload.", en: "SGLang ≥ 0.5: RadixAttention, DP-attention and expert parallel for MoE models, HiCache for offloading." }
    version: SGLang 0.5.22
    confidence: medium
    features:
      kvPaging: true
      kvPoolPreallocated: true
      prefixCaching: true
      continuousBatching: true
      slidingWindowAttention: true
      slidingWindowFreesBlocks: true
      tensorParallel: true
      pipelineParallel: true
      dpAttention: true
      kvOffload: true
    featureNotes:
      kvPaging: { fr: "--page-size (1 token par défaut).", en: "--page-size (1 token by default)." }
      kvPoolPreallocated: { fr: "--mem-fraction-static couvre poids + pool KV ; activations et graphes CUDA viennent du reste de la mémoire.", en: "--mem-fraction-static covers weights + KV pool; activations and CUDA graphs come from the rest of the memory." }
      prefixCaching: { fr: "RadixAttention (--disable-radix-cache pour la couper).", en: "RadixAttention (--disable-radix-cache to turn it off)." }
      slidingWindowFreesBlocks: { fr: "Pool hybride SWA (--swa-full-tokens-ratio, 0,8 par défaut) ; --disable-hybrid-swa-memory le désactive.", en: "Hybrid SWA pool (--swa-full-tokens-ratio, 0.8 by default); --disable-hybrid-swa-memory turns it off." }
      pipelineParallel: { fr: "--pp-size, documenté pour réduire le TTFT des longs contextes.", en: "--pp-size, documented to reduce long-context TTFT." }
      dpAttention: { fr: "--attn-dp-size (remplace --enable-dp-attention) avec --ep-size pour les experts.", en: "--attn-dp-size (replaces --enable-dp-attention) with --ep-size for the experts." }
      kvOffload: { fr: "HiCache : --enable-hierarchical-cache, --hicache-ratio / --hicache-size.", en: "HiCache: --enable-hierarchical-cache, --hicache-ratio / --hicache-size." }
    sources:
      - { label: { fr: "Arguments du serveur SGLang", en: "SGLang server arguments" }, url: "https://docs.sglang.io/docs/advanced_features/server_arguments" }
      - { label: { fr: "Comptabilité mémoire (memory_hook.py, v0.5.22)", en: "Memory accounting (memory_hook.py, v0.5.22)" }, url: "https://github.com/sgl-project/sglang/blob/v0.5.22/python/sglang/srt/arg_groups/memory_hook.py" }
      - { label: { fr: "Quantification SGLang", en: "SGLang quantization" }, url: "https://github.com/sgl-project/sglang/blob/v0.5.22/docs/docs/advanced_features/quantization.mdx" }
    weightFormats:
      bf16: native
      fp16: native
      fp8: native
      int8: { level: native, note: { fr: "w8a8_int8 ou blockwise_int8.", en: "w8a8_int8 or blockwise_int8." } }
      int4: { level: native, note: { fr: "AWQ, ou GPTQ via gptq_marlin (CUDA uniquement).", en: "AWQ, or GPTQ via gptq_marlin (CUDA only)." } }
      mxfp4: native
      nvfp4: { level: native, note: { fr: "Natif sur sm100+ ; W4A16 Marlin sur sm80-90 ; FlashInfer CUTLASS sur sm120.", en: "Native on sm100+; W4A16 Marlin on sm80-90; FlashInfer CUTLASS on sm120." } }
    kvCacheFormats:
      bf16: native
      fp16: native
      fp8: { level: native, note: { fr: "--kv-cache-dtype fp8_e4m3 (ou fp8_e5m2).", en: "--kv-cache-dtype fp8_e4m3 (or fp8_e5m2)." } }
      nvfp4: { level: limited, note: { fr: "KV FP4 expérimental, selon le backend d'attention.", en: "Experimental FP4 KV, depending on the attention backend." } }
    vendorFormats:
      amd:
        weightFormats:
          int4: { level: limited, note: { fr: "AWQ par déquantification Triton ; GPTQ non supporté sous ROCm.", en: "AWQ through Triton dequantization; GPTQ not supported on ROCm." } }
          nvfp4: { level: limited, note: { fr: "petit_nvfp4 sur MI300X / MI325X.", en: "petit_nvfp4 on MI300X / MI325X." } }
    gpus:
      v100: { level: unverified, note: { fr: "Backend FlashInfer par défaut réservé à sm75+ ; --attention-backend triton en alternative, non vérifié.", en: "Default FlashInfer backend requires sm75+; --attention-backend triton as an alternative, not verified." } }
    notes:
      - { fr: "La réserve correspond à 1 − --mem-fraction-static : elle doit couvrir activations et graphes CUDA. Par défaut, SGLang réserve au moins 10 Gio sur les GPU de plus de 60 Gio.", en: "The reserve is 1 − --mem-fraction-static: it must cover activations and CUDA graphs. By default SGLang reserves at least 10 GiB on GPUs above 60 GiB." }
      - { fr: "Pas de plafond fixe de requêtes simultanées par défaut : la taille du pool KV limite la concurrence.", en: "No fixed cap on concurrent requests by default: the KV pool size limits concurrency." }
    # Activations and CUDA graphs come from outside --mem-fraction-static.
    memory: { overheadInBudget: false, fixedOverheadGiB: 0.5, cudaGraphGiB: 1.0 }
    # Chunked prefill size by GPU memory (server_args.py): < 35 GiB → 4096 (2048 under 20 GiB); < 160 GiB → 8192; otherwise 16384.
    runtime:
      maxNumBatchedTokens: 4096
      maxNumSeqs: 4096
      byMemory:
        - { minMemoryGiB: 160, maxNumBatchedTokens: 16384, maxNumSeqs: 4096 }
        - { minMemoryGiB: 60, maxNumBatchedTokens: 8192, maxNumSeqs: 4096 }
        - { minMemoryGiB: 20, maxNumBatchedTokens: 4096, maxNumSeqs: 4096 }
        - { minMemoryGiB: 0, maxNumBatchedTokens: 2048, maxNumSeqs: 4096 }
    flags:
      launch: python3 -m sglang.launch_server --model-path
      maxModelLen: --context-length
      maxNumBatchedTokens: --chunked-prefill-size
      maxNumSeqs: --max-running-requests
      memoryUtilization: --mem-fraction-static
      kvCacheDtype: --kv-cache-dtype
      kvCacheDtypeValues: { fp8: fp8_e4m3, nvfp4: nvfp4 }
      tensorParallel: --tp-size
      pipelineParallel: --pp-size
      dpAttention: --tp-size N --attn-dp-size N --ep-size N
      kvOffload: { fr: "--enable-hierarchical-cache --hicache-size <Gio>", en: "--enable-hierarchical-cache --hicache-size <GiB>" }

