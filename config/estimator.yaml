      nvfp4: { level: unsupported, note: Blackwell uniquement. }
    notes:
      - "480 Go de LPDDR5X côté Grace accessibles de façon cohérente : utilisables pour décharger du KV (LMCache, offload CPU). Non comptés ici."
      - "Un GPU par superchip : le multi-GPU dépend de la plateforme (NVL2, NVL32, nœuds quad-GH200)."

