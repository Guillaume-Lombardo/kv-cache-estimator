  - id: gh200
    name: GH200 (96 Go)
    architecture: Hopper + Grace
    computeCapability: "9.0"
    memoryGiB: 95.6
    memoryLabel: 96 Go HBM3 (+480 Go LPDDR5X)
    bandwidthTBs: 4.0
    interconnect: { label: "NVLink-C2C CPU↔GPU (900 Go/s) ; GPU↔GPU selon plateforme", nvlink: true, bandwidthGBs: 900 }
