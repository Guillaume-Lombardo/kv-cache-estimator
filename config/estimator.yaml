      nvfp4: native
    kvCacheFormats: *blackwellKv
    notes:
      - "Mémoire visible approximative (288 Go décimaux ≈ 268 Gio) : vérifiez avec nvidia-smi."

  - id: gb300
    name: GB300
    architecture: Blackwell Ultra + Grace
    computeCapability: "10.3"
